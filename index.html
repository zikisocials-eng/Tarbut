<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לוח הופעות ואירועים תלת-ממדי - קריית התרבות אונו</title>
    <!-- Tailwind CSS -->
    <script src="https://jsdelivr.net"></script>
    <style>
        @import url('https://googleapis.com');
        body { font-family: 'Heebo', sans-serif; }
        
        /* אפקטי זכוכית ועומק מותאמים אישית */
        .glass-card {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px border;
            border-color: rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            transform-style: preserve-3d;
            perspective: 1000px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .glass-card:hover {
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 30px 60px rgba(99, 102, 241, 0.15), inset 0 1px 2px rgba(255, 255, 255, 0.2);
        }
        .translate-3d {
            transform: translateZ(30px);
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen antialiased flex flex-col relative overflow-x-hidden selection:bg-indigo-500 selection:text-white">

    <!-- כדורי רקע זוהרים לאפקט תלת ממד עמוק מאחורי הזכוכית -->
    <div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-indigo-600/10 blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-[20%] right-[-10%] w-[40vw] h-[40vw] rounded-full bg-purple-600/10 blur-[120px] pointer-events-none"></div>
    <div class="absolute top-[40%] left-[40%] w-[30vw] h-[30vw] rounded-full bg-pink-600/5 blur-[100px] pointer-events-none"></div>

    <!-- סרגל עליון עתידני -->
    <header class="relative overflow-hidden pt-16 pb-8 text-center z-10">
        <div class="max-w-4xl mx-auto px-4">
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 mb-5 backdrop-blur-md">
                <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></span>
                ממשק תלת-ממדי אינטראקטיבי
            </span>
            <h1 class="text-4xl md:text-6xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-200 to-indigo-300 drop-shadow-sm">
                אירועים והופעות באונו
            </h1>
            <p class="text-slate-400 mt-4 text-base md:text-xl max-w-xl mx-auto font-light leading-relaxed">
                חוויית תרבות עתידנית בזמן אמת מתוך לוח האירועים הרשמי.
            </p>
        </div>
    </header>

    <!-- אזור התוכן הראשי -->
    <main class="flex-grow max-w-7xl mx-auto px-6 py-8 w-full z-10">
        <!-- הודעת טעינה מונפשת בתלת ממד -->
        <div id="loader" class="flex flex-col items-center justify-center py-32">
            <div class="relative w-20 h-20">
                <div class="absolute inset-0 rounded-full border-4 border-slate-800/80"></div>
                <div class="absolute inset-0 rounded-full border-4 border-indigo-500 border-t-transparent animate-spin shadow-[0_0_15px_rgba(99,102,241,0.5)]"></div>
            </div>
            <p class="text-indigo-300/80 text-lg mt-8 font-medium tracking-wide animate-pulse">מפיק כרטיסיות תלת-ממד...</p>
        </div>

        <!-- גריד כרטיסיות ההופעות -->
        <div id="events-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 p-2"></div>
    </main>

    <!-- שוליים תחתונים -->
    <footer class="text-center py-8 border-t border-slate-900/60 text-xs text-slate-500 bg-slate-950/20 backdrop-blur-sm z-10">
        <p>הנתונים מתעדכנים ישירות מקריית התרבות אונו. פיתוח ממשק עתידני 2026.</p>
    </footer>

    <script>
        const fallbackImages = {
            music: "https://unsplash.com",
            standup: "https://unsplash.com",
            theater: "https://unsplash.com",
            kids: "https://unsplash.com",
            default: "https://unsplash.com"
        };

        function getEventImage(title) {
            const t = title.toLowerCase();
            if (t.includes('מופע') || t.includes('סטנדאפ') || t.includes('רועי לוי') || t.includes('צחוק')) return fallbackImages.standup;
            if (t.includes('מוזיק') || t.includes('שירה') || t.includes('דני') || t.includes('ניצני') || t.includes('בלוז')) return fallbackImages.music;
            if (t.includes('הצגה') || t.includes('מחזה') || t.includes('תיאטרון') || t.includes('מקליד')) return fallbackImages.theater;
            if (t.includes('ילדים') || t.includes('דוליטל') || t.includes('קרקס') || t.includes('קוסם')) return fallbackImages.kids;
            return fallbackImages.default;
        }

        async function fetchEvents() {
            const targetUrl = 'https://tarbutono.co.il';

            try {
                let response = await fetch(`https://allorigins.win{encodeURIComponent(targetUrl)}`);
                let htmlText = '';
                
                if (response.ok) {
                    const data = await response.json();
                    htmlText = data.contents;
                } else {
                    const fallbackResponse = await fetch(`https://freeboard.io{targetUrl}`);
                    htmlText = await fallbackResponse.text();
                }
                
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                
                const eventElements = doc.querySelectorAll('.em-card, .elementor-post, article, [class*="post-"]'); 
                const container = document.getElementById('events-container');
                document.getElementById('loader').classList.add('hidden');

                if (eventElements.length === 0) {
                    showEmbedFallback();
                    return;
                }

                eventElements.forEach(el => {
                    const title = el.querySelector('h3, h2, .em-card-title, .title')?.innerText.trim() || 'מופע תרבות מיוחד';
                    const dateText = el.querySelector('.em-card-date, .date, time, [class*="meta"]')?.innerText.trim() || 'פרטים מלאים באתר';
                    const link = el.querySelector('a')?.href || targetUrl;
                    const imgUrl = getEventImage(title);
                    
                    const card = document.createElement('div');
                    card.className = "glass-card rounded-2xl overflow-hidden flex flex-col justify-between p-4 cursor-pointer";
                    
                    card.innerHTML = `
                        <div class="translate-3d duration-300">
                            <!-- תמונה שקועה עם צל פנימי -->
                            <div class="relative h-48 w-full overflow-hidden rounded-xl bg-slate-900 shadow-inner">
                                <div class="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-slate-950/20 to-transparent z-10"></div>
                                <img src="${imgUrl}" alt="${title}" class="w-full h-full object-cover opacity-80 group-hover:scale-105 transition-transform duration-500">
                                <span class="absolute top-3 right-3 z-20 inline-flex items-center gap-1 px-2.5 py-1 rounded-md text-xs font-semibold bg-slate-950/80 text-cyan-400 border border-slate-800 backdrop-blur-md shadow-lg">
                                    📍 קריית התרבות
                                </span>
                            </div>
                            
                            <!-- תוכן טקסט בולט החוצה בתלת ממד -->
                            <div class="py-5 px-2">
                                <h3 class="text-xl font-bold text-white leading-snug tracking-wide line-clamp-2 hover:text-indigo-400 transition-colors duration-200">
                                    ${title}
                                </h3>
                                <div class="mt-4 pt-4 border-t border-slate-700/30 flex items-center gap-2.5 text-sm text-slate-300">
                                    <span class="text-xl filter drop-shadow-[0_0_5px_rgba(34,211,238,0.4)]">📅</span>
                                    <span><strong>מועד:</strong> ${dateText}</span>
                                </div>
                            </div>
                        </div>

                        <!-- כפתור מעוצב זוהר -->
                        <div class="p-2 pt-0 translate-3d">
                            <a href="${link}" target="_blank" class="flex items-center justify-center gap-2 w-full text-center bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-purple-500 text-white font-semibold py-3 px-4 rounded-xl transition-all duration-300 shadow-[0_4px_20px_rgba(99,102,241,0.2)] hover:shadow-[0_4px_25px_rgba(168,85,247,0.4)] transform hover:-translate-y-0.5">
                                שריון מקומות וכרטיסים ←
                            </a>
                        </div>
                    `;

                    // הוספת פונקציונליות תזוזה תלת-ממדית (3D Tilt Effect) לכל כרטיס
                    card.addEventListener('mousemove', (e) => {
חשוב להשתמש בקוד בזהירות.
const rect = card.getBoundingClientRect();
const x = e.clientX - rect.left;
const y = e.clientY - rect.top;
const xc = rect.width / 2;
const yc = rect.height / 2;
const angleX = (yc - y) / 15;
const angleY = (x - xc) / 15;
card.style.transform = rotateX(${angleX}deg) rotateY(${angleY}deg) translateY(-5px);
});
card.addEventListener('mouseleave', () => {
card.style.transform = 'rotateX(0deg) rotateY(0deg) translateY(0px)';
});
container.appendChild(card);
});
} catch (error) {
console.error(error);
showEmbedFallback();
}
}
function showEmbedFallback() {
document.getElementById('loader').classList.add('hidden');
const container = document.getElementById('events-container');
container.className = "w-full col-span-full max-w-5xl mx-auto";
container.innerHTML = <div class="glass-card p-4 rounded-2xl flex flex-col h-[80vh]"> <iframe src="https://tarbutono.co.il" class="w-full flex-grow rounded-xl bg-white border-none" style="color-scheme: light;"></iframe> </div>;
}
window.addEventListener('DOMContentLoaded', fetchEvents);
